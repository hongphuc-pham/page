name: Deploy to GitHub Pages

# The one workflow that publishes https://hongphuc-pham.github.io/page/.
#
# A Pages site has exactly ONE deployment, so there must only ever be one
# workflow that uploads a pages artifact. There used to be two — this one
# building the Vite app and a manual-only deploy-portfolio.yml building the
# Next app — and the push-triggered Vite one always won, which is why the site
# kept showing the old app after the Next port merged. The Vite app is gone;
# this builds the Next static export and nothing else.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build static export
        # A project page is served from /<repo>, so every asset URL needs that
        # prefix. Without it the deployed page loads blank with 404s on /_next/*.
        env:
          NEXT_PUBLIC_BASE_PATH: /page
        run: pnpm build

      - name: Verify the export looks right
        # Cheap guard against the two failure modes that are invisible until
        # someone opens the live URL: a missing .nojekyll (Jekyll silently drops
        # _next/) and asset URLs that forgot the base path.
        run: |
          test -f out/.nojekyll || { echo "::error::out/.nojekyll missing — Jekyll will drop _next/"; exit 1; }
          grep -q '/page/_next/' out/index.html || { echo "::error::index.html has no /page/_next/ URLs — basePath did not apply"; exit 1; }
          echo "export OK: $(find out -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
